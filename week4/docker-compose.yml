services:

  backend:
    build:
      context: ../week3/college-management-system
      dockerfile: Dockerfile
    container_name: week4-backend
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: "1234"
      DB_NAME: collegedata
      DB_PORT: 3306
      PORT: 5000
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    container_name: week4-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: collegedata
    ports:
      - "3309:3306"
    volumes:
      - week4_mysql_data:/var/lib/mysql
      - ../week3/college-management-system/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p1234 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  nginx:
    image: nginx:alpine
    container_name: week4-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  week4_mysql_data:
